name: keepalive

# Бесплатный тариф Render усыпляет сервис после ~15 минут без входящих запросов,
# и вместе с ним останавливается опрос Telegram — бот перестаёт принимать
# объявления. Этот workflow дёргает /api/health и не даёт сервису уснуть.
#
# Оговорки бесплатных раннеров GitHub: расписание плавает (запуск может
# задержаться на 5–15 минут), а после 60 дней без коммитов в репозиторий
# отключается вовсе. Как единственный механизм — ненадёжно, лучше поверх
# настроить внешний пингер (UptimeRobot и подобные).
#
# Адрес можно переопределить переменной репозитория HEALTH_URL
# (Settings -> Secrets and variables -> Actions -> Variables).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Разбудить сервис и проверить здоровье
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          URL="${HEALTH_URL:-https://podrabotka24.onrender.com/api/health}"
          echo "Проверяю $URL"

          # Холодный старт Render занимает до минуты, поэтому длинный таймаут
          # и повторы: сервис ещё поднимается и может отдать 502/503.
          BODY=$(curl -sS --max-time 120 --retry 3 --retry-delay 15 \
                      --retry-all-errors "$URL") || {
            echo "::error::Сервис не ответил за отведённое время"
            exit 1
          }

          echo "Ответ: $BODY"

          echo "$BODY" | python3 -c '
          import json, sys
          try:
              d = json.load(sys.stdin)
          except Exception:
              print("::error::Ответ не является JSON — сервис отдал что-то другое")
              sys.exit(1)
          if not d.get("ok"):
              print("::error::Сервис отвечает, но ok=false")
              sys.exit(1)
          if not d.get("db"):
              print("::error::Сервис жив, но база недоступна")
              sys.exit(1)
          print("Живой. Версия:", d.get("commit", "?"), "| канал:", d.get("channel", "?"))
          '
